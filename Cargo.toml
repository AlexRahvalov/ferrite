[workspace]
resolver = "2"
members = [
    "crates/ferrite-nbt",
    "crates/ferrite-protocol",
    "crates/ferrite-net",
    "crates/ferrite-world",
    "crates/ferrite-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

ferrite-nbt = { path = "crates/ferrite-nbt" }
ferrite-protocol = { path = "crates/ferrite-protocol" }
ferrite-net = { path = "crates/ferrite-net" }
